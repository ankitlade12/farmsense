[project]
name = "farmsense"
version = "0.1.0"
description = "AI agronomist for smallholder farmers — Elastic Agent Builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
